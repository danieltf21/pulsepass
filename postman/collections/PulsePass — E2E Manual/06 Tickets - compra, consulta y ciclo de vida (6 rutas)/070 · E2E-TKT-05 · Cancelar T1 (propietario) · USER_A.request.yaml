$kind: http-request
description: |-
  ID: E2E-TKT-05
  Paso de ejecución: 070
  Objetivo: Cancelar T1 (propietario)
  Actor: USER_A
  Precondiciones: Haber ejecutado antes TC-SEC-009 a TC-SEC-012.
  Autorización: Bearer {{userAToken}}
  Ejecución: abrir request y pulsar Send
  HTTP esperado: 200
  Revisión manual: status=CANCELLED.
  Evidencia: anotar HTTP real, resultado y observación en registro-ejecucion-manual.md
  La pestaña de scripts debe permanecer vacía.
url: "{{baseUrl}}/api/tickets/{{ticketCancelableCode}}/cancel"
method: PATCH
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{userAToken}}"
order: 6000
