$kind: http-request
description: |-
  ID: TC-BIZ-007B
  Paso de ejecución: 059
  Objetivo: Comprar ticket T2 (USER_A)
  Actor: USER_A
  Precondiciones: Backend arriba y pasos anteriores ejecutados.
  Autorización: Bearer {{userAToken}}
  Ejecución: abrir request y pulsar Send
  HTTP esperado: 201
  Revisión manual: Segundo ticket independiente, ticketCode distinto a T1.
  COPIAR a mano: ticketCode -> variable ticketUsableCode
  Evidencia: anotar HTTP real, resultado y observación en registro-ejecucion-manual.md
  La pestaña de scripts debe permanecer vacía.
url: "{{baseUrl}}/api/tickets"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "userEmail": "{{userAEmail}}",
      "eventCode": "{{publishedEventCode}}",
      "type": "GENERAL"
    }
auth:
  type: bearer
  credentials:
    token: "{{userAToken}}"
order: 4000
