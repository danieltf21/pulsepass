$kind: http-request
description: |-
  ID: TC-AUTH-003
  Paso de ejecución: 016
  Objetivo: Login USER_A (email)
  Actor: ANONYMOUS
  Precondiciones: Backend arriba y pasos anteriores ejecutados.
  Autorización: Sin Authorization (pestaña Authorization en No Auth)
  Ejecución: abrir request y pulsar Send
  HTTP esperado: 200
  Revisión manual: 200 con accessToken; mismo usuario. No hace falta copiar este token.
  Evidencia: anotar HTTP real, resultado y observación en registro-ejecucion-manual.md
  La pestaña de scripts debe permanecer vacía.
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "identifier": "{{userAEmail}}",
      "password": "{{userAPassword}}"
    }
auth:
  type: noauth
order: 4000
