$kind: http-request
description: |-
  ID: TC-AUTH-006A
  Paso de ejecución: 023
  Objetivo: Quién soy (ADMIN)
  Actor: ADMIN
  Precondiciones: Backend arriba y pasos anteriores ejecutados.
  Autorización: Bearer {{adminToken}}
  Ejecución: abrir request y pulsar Send
  HTTP esperado: 200
  Revisión manual: e2e_admin, roles=[ADMIN].
  Evidencia: anotar HTTP real, resultado y observación en registro-ejecucion-manual.md
  La pestaña de scripts debe permanecer vacía.
url: "{{baseUrl}}/api/auth/me"
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
order: 11000
