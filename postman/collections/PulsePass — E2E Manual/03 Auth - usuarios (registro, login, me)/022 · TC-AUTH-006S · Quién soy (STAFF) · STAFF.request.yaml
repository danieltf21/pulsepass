$kind: http-request
description: |-
  ID: TC-AUTH-006S
  Paso de ejecución: 022
  Objetivo: Quién soy (STAFF)
  Actor: STAFF
  Precondiciones: Backend arriba y pasos anteriores ejecutados.
  Autorización: Bearer {{staffToken}}
  Ejecución: abrir request y pulsar Send
  HTTP esperado: 200
  Revisión manual: e2e_staff, roles=[STAFF].
  Evidencia: anotar HTTP real, resultado y observación en registro-ejecucion-manual.md
  La pestaña de scripts debe permanecer vacía.
url: "{{baseUrl}}/api/auth/me"
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{staffToken}}"
order: 10000
