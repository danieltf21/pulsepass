$kind: http-request
description: |-
  ID: TC-SEC-001B
  Paso de ejecución: 043
  Objetivo: Crear evento como USER_A
  Actor: USER_A
  Precondiciones: Backend arriba y pasos anteriores ejecutados.
  Autorización: Bearer {{userAToken}}
  Ejecución: abrir request y pulsar Send
  HTTP esperado: 403
  Revisión manual: ErrorResponse 403. No se crea el evento.
  Evidencia: anotar HTTP real, resultado y observación en registro-ejecucion-manual.md
  La pestaña de scripts debe permanecer vacía.
url: "{{baseUrl}}/api/events"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "eventCode": "E2E-NEG-{{runId}}",
      "name": "PulsePass E2E {{runId}}",
      "description": "Evento de prueba manual",
      "category": "MUSIC",
      "eventDate": "2028-06-15T20:00:00",
      "minimumAge": 0,
      "venueCode": "{{venueActiveCode}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{userAToken}}"
order: 13000
