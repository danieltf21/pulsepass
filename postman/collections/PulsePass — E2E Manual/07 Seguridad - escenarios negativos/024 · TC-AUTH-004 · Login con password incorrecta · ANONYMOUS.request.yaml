$kind: http-request
description: |-
  ID: TC-AUTH-004
  Paso de ejecución: 024
  Objetivo: Login con password incorrecta
  Actor: ANONYMOUS
  Precondiciones: Backend arriba y pasos anteriores ejecutados.
  Autorización: Sin Authorization (pestaña Authorization en No Auth)
  Ejecución: abrir request y pulsar Send
  HTTP esperado: 401
  Revisión manual: ErrorResponse 401 con mensaje genérico. Anota el message: debe ser igual al del caso siguiente.
  Evidencia: anotar HTTP real, resultado y observación en registro-ejecucion-manual.md
  La pestaña de scripts debe permanecer vacía.
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "identifier": "{{userAUsername}}",
      "password": "ClaveIncorrecta-123"
    }
auth:
  type: noauth
order: 2000
