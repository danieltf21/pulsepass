$kind: http-request
description: |-
  ID: TC-SEC-001A
  Paso de ejecución: 042
  Objetivo: Crear evento sin token
  Actor: ANONYMOUS
  Precondiciones: Backend arriba y pasos anteriores ejecutados.
  Autorización: Sin Authorization (pestaña Authorization en No Auth)
  Ejecución: abrir request y pulsar Send
  HTTP esperado: 401
  Revisión manual: ErrorResponse 401. No se crea el evento.
  Evidencia: anotar HTTP real, resultado y observación en registro-ejecucion-manual.md
  La pestaña de scripts debe permanecer vacía.
url: "{{baseUrl}}/api/events"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "eventCode": "E2E-NEG-{{runId}}",
      "name": "PulsePass E2E {{runId}}",
      "description": "Evento de prueba manual",
      "category": "MUSIC",
      "eventDate": "2028-06-15T20:00:00",
      "minimumAge": 0,
      "venueCode": "{{venueActiveCode}}"
    }
auth:
  type: noauth
order: 12000
