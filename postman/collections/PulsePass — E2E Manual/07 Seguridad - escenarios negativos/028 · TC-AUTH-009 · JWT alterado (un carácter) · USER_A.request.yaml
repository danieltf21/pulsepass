$kind: http-request
description: |-
  ID: TC-AUTH-009
  Paso de ejecución: 028
  Objetivo: JWT alterado (un carácter)
  Actor: USER_A
  Precondiciones: En la pestaña Authorization cambia el ÚLTIMO carácter del token. NO guardes ese cambio.
  Autorización: Bearer {{userAToken}}
  Ejecución: abrir request y pulsar Send
  HTTP esperado: 401
  Revisión manual: 401; nunca llega al controlador.
  Evidencia: anotar HTTP real, resultado y observación en registro-ejecucion-manual.md
  La pestaña de scripts debe permanecer vacía.
url: "{{baseUrl}}/api/auth/me"
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{userAToken}}"
order: 6000
