$kind: http-request
description: |-
  ID: TC-VAL-18
  Paso de ejecución: 096
  Objetivo: Comprar para evento inexistente
  Actor: USER_A
  Precondiciones: Backend arriba y pasos anteriores ejecutados.
  Autorización: Bearer {{userAToken}}
  Ejecución: abrir request y pulsar Send
  HTTP esperado: 404
  Revisión manual: 404; no se crea ticket.
  Evidencia: anotar HTTP real, resultado y observación en registro-ejecucion-manual.md
  La pestaña de scripts debe permanecer vacía.
url: "{{baseUrl}}/api/tickets"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "userEmail": "{{userAEmail}}",
      "eventCode": "NO-EXISTE-{{runId}}",
      "type": "GENERAL"
    }
auth:
  type: bearer
  credentials:
    token: "{{userAToken}}"
order: 18000
