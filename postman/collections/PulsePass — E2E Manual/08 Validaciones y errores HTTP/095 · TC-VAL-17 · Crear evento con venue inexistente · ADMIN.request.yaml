  type: json
  content: |-
    {
      "eventCode": "E2E-NEG-{{runId}}",
      "name": "PulsePass E2E {{runId}}",
      "description": "Evento de prueba manual",
      "category": "MUSIC",
      "eventDate": "2028-06-15T20:00:00",
      "minimumAge": 0,
      "venueCode": "NO-EXISTE"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
order: 17000
