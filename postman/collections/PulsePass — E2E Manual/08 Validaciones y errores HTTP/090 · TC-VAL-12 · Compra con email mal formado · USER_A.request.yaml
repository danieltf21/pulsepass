$kind: http-request
description: |-
  ID: TC-VAL-12
  Paso de ejecución: 090
  Objetivo: Compra con email mal formado
  Actor: USER_A
  Precondiciones: Backend arriba y pasos anteriores ejecutados.
  Autorización: Bearer {{userAToken}}
  Ejecución: abrir request y pulsar Send
  HTTP esperado: 400
  Revisión manual: 400 con details sobre userEmail.
  Evidencia: anotar HTTP real, resultado y observación en registro-ejecucion-manual.md
  La pestaña de scripts debe permanecer vacía.
url: "{{baseUrl}}/api/tickets"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "userEmail": "no-es-un-email",
      "eventCode": "{{publishedEventCode}}",
      "type": "GENERAL"
    }
auth:
  type: bearer
  credentials:
    token: "{{userAToken}}"
order: 12000
